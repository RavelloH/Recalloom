# Cloudflare Workers Builds: use real package directories rather than
# relying on symlinks between pnpm's virtual-store package directories.
nodeLinker: hoisted

allowBuilds:
  '@astryxdesign/core': true
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261027.1'
  - 'text-version@2.2.0'
patchedDependencies:
  tiptap-extension-code-block-shiki@1.2.0: patches/tiptap-extension-code-block-shiki@1.2.0.patch
